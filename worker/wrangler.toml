name = "mindurset-worker"
main = "src/index.ts"
compatibility_date = "2026-10-21"

# Workers AI platform binding. The name is `AI`; no key or token is stored in
# this repository. Local `wrangler dev` needs `wrangler login` for live
# inference; without it the Worker serves the offline fallback.
[ai]
binding = "AI"
remote = true

# The corpus is markdown on disk. Wrangler bundles it as text, and
# vitest.config.mjs gives the test runner the same behaviour.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Approval-style rate limiting for the three generation endpoints. The key is the
# account uid when the request carries one, otherwise the edge client address.
# The limit is loose on purpose: it exists to stop a runaway client, not to
# police a shared campus network.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60
